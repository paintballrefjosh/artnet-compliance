# Linux-only deployment path. Art-Net needs real broadcast/unicast access to
# the host's LAN interface, which network_mode: host provides natively on
# Linux. This mode is NOT supported by Docker Desktop on macOS/Windows — see
# README.md for why the Mac install uses a plain Python venv instead.
services:
  artnet-monitor:
    build: .
    network_mode: host
    # Writable on purpose: the dashboard rewrites patch.yaml on every patch,
    # group, rule, and cue edit. Mounting this :ro breaks every write.
    volumes:
      - ./config:/app/config
    environment:
      # Uncomment to require a token, which you'll want since network_mode:
      # host exposes the dashboard on the LAN.
      # ARTNET_AUTH_TOKEN: "change-me"
      {}
    restart: unless-stopped

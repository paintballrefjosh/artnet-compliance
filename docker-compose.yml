# Linux-only deployment path. Art-Net needs real broadcast/unicast access to
# the host's LAN interface, which network_mode: host provides natively on
# Linux. This mode is NOT supported by Docker Desktop on macOS/Windows — see
# README.md for why the Mac install uses a plain Python venv instead.
services:
  artnet-monitor:
    build: .
    network_mode: host
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
